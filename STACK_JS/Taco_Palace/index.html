<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Agustín Sanchez">
    <link rel="stylesheet" href="static/css/style.css">
    <title>TACO PALACE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
</head>

<body>
    <header class="encabezado">
        <div class="marca">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/logo.png" alt="Logo Taco Palace"
                class="logo-imagen">

            <h1>
                <span class="nombre-taco">Taco</span>Palace
            </h1>
        </div>

        <div class="zona-superior">
            <div class="formulario-login">
                <input type="text" id="correo" placeholder="email">

                <button type="button" id="boton-login" class="boton-ingreso">
                    Login
                </button>
            </div>

            <div class="carrito-compras">
                <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/carrito.png" alt="Carrito de compras"
                    class="carrito-imagen">

                <span id="cantidad-carrito">0</span>
            </div>
        </div>
    </header>

    <nav class="barra-categorias">

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/enchiladas.jpg" alt="Categoría Enchiladas"
                class="imagen-categoria">

            <p>Enchiladas</p>
        </div>

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/tacos.jpg" alt="Categoría Tacos"
                class="imagen-categoria">

            <p>Tacos</p>
        </div>

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/flautas.jpg" alt="Categoría Flautas"
                class="imagen-categoria">

            <p>Flautas</p>
        </div>

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/gorditas.jpg" alt="Categoría Gorditas"
                class="imagen-categoria">

            <p>Gorditas</p>
        </div>

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/tostadas.jpg" alt="Categoría Tostadas"
                class="imagen-categoria">

            <p>Tostadas</p>
        </div>

        <div class="categoria">
            <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/enfrijoladas.jpg"
                alt="Categoría Enfrijoladas" class="imagen-categoria">

            <p>Enfrijoladas</p>
        </div>

    </nav>

    <main class="contenido-principal">

        <section class="area-platillos">

            <div class="descripcion">
                <h2>
                    La mejor variedad en platillos de comida
                    <span>mexicana</span>
                </h2>

                <p>
                    Contamos con
                    <strong>servicio a domicilio</strong>
                </p>
            </div>

            <div class="marco-imagen">
                <img id="foto-comida" src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/comida-mexicana.jpg"
                    alt="PlatoMexico">
            </div>

        </section>

        <aside class="lista-recomendados">

            <h3>Recomendados:</h3>

            <div class="producto-card">

                <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/orden-tacos.jpg"
                    alt="Orden de Tacos Recomendada" class="imagen-orden">

                <div class="detalles-card">
                    <span>Orden de Tacos</span>

                    <button type="button" class="boton-agregar">
                        +
                    </button>
                </div>

                <a href="#">Ver Más...</a>

            </div>

            <div class="producto-card">

                <img src="static/images/Imágenes-20260904T115517Z-1-001/Imágenes/orden-flautas.jpg"
                    alt="Orden de Flautas Recomendada" class="imagen-orden">

                <div class="detalles-card">
                    <span>Orden de Flautas</span>

                    <button type="button" class="boton-agregar">
                        +
                    </button>
                </div>

                <a href="#">Ver Más...</a>

            </div>

        </aside>

    </main>

    <script src="static/js/script.js"></script>

</body>

</html>
